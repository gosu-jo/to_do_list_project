<head>
    <h1>수정페이지</h1>
</head>

<body>
    <fieldset>
        <legend>할일목록수정</legend>
        <form action="/write/update/{{ index }}" method="post">
            <label for="to_do">할일</label>
            <input type="text" id="to_do" name="to_do" required value="{{ to_do_list['to_do'] }}">
            <label for="time">시간</label>
            <input type="time" id="time" name="time" required value="{{ to_do_list['time'] }}">
            <label for="content">내용</label>
            <textarea type="text" id="content" name="content" required>{{ to_do_list['content'] }}</textarea>


            <button type="submit">수정작성하기</button>
            <button type="submit" formaction="/delete/{{ index }}">삭제하기</button>
        </form>
    </fieldset>

</body>
